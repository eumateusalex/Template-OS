# Segredos no histórico inteiro do repositório, pelo gitleaks, a cada push, em
# qualquer ramo.
#
# SEM filtro de caminho nem de ramo, de propósito: uma chave commitada e depois
# apagada em `_memoria/`, `.mcp.json` ou `marketing/` só é vista por quem varre o
# histórico inteiro, e um ramo que não é a main também fica público no GitHub.
#
# E uma rodada NÃO cancela a anterior: se o push seguinte reescreveu o histórico
# para tirar a chave, a rodada nova varre um histórico já limpo e fica verde, e a
# única que acusaria foi cancelada. Ninguém veria o vermelho que manda trocar a
# chave, que continua acessível pelo SHA antigo.
#
# O binário é fixado na versão e conferido pelo sha256 do release: nenhuma Action
# de terceiro no caminho. Achado que não é segredo vai no `.gitleaksignore`, pela
# impressão digital e com a razão; caso plantado de propósito (chave falsa num
# teste) leva `gitleaks:allow` na própria linha. Custo medido: 2 a 5 s.

name: Segredos

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: segredos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Segredos no histórico (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
