<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- A capa do Reel falado, enviada à parte (o Instagram aceita capa própria): um quadro da
         câmera com o título da capa a um terço do topo, na ficha de estilo da peça. Copiada para a
         pasta por scripts/reel-falado/montar.mjs. Render: npx hyperframes render -c compositions/capa.html
         Os caminhos são da raiz da peça: o HyperFrames serve a composição com a raiz como base. -->
    {{MARCA}}
    <script src="_vendor/gsap.min.js"></script>
    <script src="dados.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #camera-capa { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #titulo { position: absolute; left: 50%; top: 300px; z-index: 40; text-align: center; line-height: 1.08; }
      #titulo .caixa { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="capa" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <video id="camera-capa" class="clip" src="camera.mp4" data-start="0" data-duration="1" data-media-start="{{CAPA_QUADRO}}" muted playsinline preload="auto"></video>
      <div id="titulo" data-layout-allow-overlap></div>
    </div>
    <script>
      const D = window.DADOS;
      const F = D.ficha;
      const t = document.getElementById('titulo');
      t.style.fontFamily = F.fonte === 'marca' ? 'var(--f-display), sans-serif' : "'" + F.fonte + "', var(--f-display), sans-serif";
      t.style.fontWeight = F.peso;
      t.style.fontSize = Math.round(F.tamanho * 1.35) + 'px';
      t.style.color = F.cor;
      t.style.width = F.largura + 'px';
      t.style.marginLeft = -F.largura / 2 + 'px';
      const c = document.createElement('span');
      c.className = 'caixa';
      c.style.webkitTextStroke = F.contorno + 'px ' + F.contorno_cor;
      c.style.paintOrder = 'stroke fill';
      c.style.textShadow = F.sombra;
      if (F.fundo !== 'none') {
        c.style.background = F.fundo;
        c.style.padding = '0.12em 0.4em';
        c.style.borderRadius = '0.3em';
      }
      // a quebra de linha é a que a peça pediu (o `\n` da capa), não a da largura
      D.capa.linhas.forEach(function (linha, i) {
        if (i) c.appendChild(document.createElement('br'));
        c.appendChild(document.createTextNode(linha));
      });
      t.appendChild(c);
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines = window.__timelines || {};
      window.__timelines['capa'] = tl;
    </script>
  </body>
</html>
